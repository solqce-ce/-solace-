<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="色を試しながら配色をつくれるパレット作成ワークベンチ。">
    <title>パレット作成ワークベンチ | solace</title>
    <link rel="stylesheet" href="corporate-theme.css?v=20260303-layout">
    <style>
        :root {
            --ink: #172321;
            --muted: #65716d;
            --paper: #f7f5ef;
            --panel: rgba(255, 255, 255, 0.82);
            --line: rgba(23, 35, 33, 0.14);
            --accent: #d77855;
            --accent-dark: #a94f36;
            --shadow: 0 24px 60px rgba(23, 35, 33, 0.1);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 10%, rgba(239, 176, 105, 0.22), transparent 30%),
                radial-gradient(circle at 88% 84%, rgba(132, 178, 169, 0.2), transparent 34%),
                var(--paper);
            font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
            line-height: 1.7;
        }

        button, select { font: inherit; }
        button { cursor: pointer; }
        a { color: inherit; text-decoration: none; }

        .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 70px; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 72px; }
        .brand { font-family: Georgia, serif; font-size: 1.3rem; font-weight: 700; letter-spacing: 0.04em; }
        .back-link { color: var(--muted); font-size: 0.88rem; }
        .back-link:hover { color: var(--accent-dark); }

        .intro { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 50px; align-items: end; margin-bottom: 44px; }
        .eyebrow { color: var(--accent-dark); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.16em; }
        h1 { max-width: 760px; margin: 12px 0 16px; font-family: Georgia, serif; font-size: clamp(2.3rem, 6vw, 5.2rem); line-height: 1.04; letter-spacing: -0.04em; }
        .intro p { max-width: 620px; margin: 0; color: var(--muted); }
        .intro-note { padding: 22px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.5); transform: rotate(3deg); }
        .intro-note strong { display: block; margin-bottom: 8px; font-family: Georgia, serif; font-size: 1.3rem; }
        .intro-note span { color: var(--muted); font-size: 0.86rem; }

        .workbench { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 18px; align-items: start; }
        .panel { border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); }
        .controls { padding: 24px; }
        .panel-title { margin: 0 0 18px; font-family: Georgia, serif; font-size: 1.4rem; }
        .field { margin-bottom: 22px; }
        .field label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; color: var(--muted); font-size: 0.83rem; }
        .field output { color: var(--ink); font-weight: 700; }
        input[type="range"] { width: 100%; accent-color: var(--accent); }
        select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fffdf8; color: var(--ink); }
        .control-actions { display: grid; gap: 9px; margin-top: 28px; }
        .button { border: 1px solid var(--ink); border-radius: 999px; padding: 11px 16px; background: var(--ink); color: #fffdf8; font-weight: 700; }
        .button:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
        .button.secondary { background: transparent; color: var(--ink); }
        .button.secondary:hover { background: var(--ink); color: #fffdf8; }

        .palette-panel { min-width: 0; padding: 18px; }
        .palette-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 18px; }
        .palette-header h2 { margin: 0; font-family: Georgia, serif; font-size: 1.35rem; }
        .palette-header span { color: var(--muted); font-size: 0.8rem; }
        .swatches { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
        .swatch { min-width: 0; overflow: hidden; border: 1px solid rgba(23, 35, 33, 0.12); background: #fff; }
        .swatch-color { min-height: 250px; padding: 10px; display: flex; justify-content: flex-end; align-items: flex-start; }
        .lock { width: 30px; height: 30px; border: 1px solid rgba(255,255,255,0.75); border-radius: 50%; background: rgba(0,0,0,0.18); color: #fff; }
        .lock[aria-pressed="true"] { background: var(--ink); }
        .swatch-info { padding: 12px; }
        .swatch-info strong { display: block; font-size: 0.9rem; }
        .swatch-info button { margin-top: 4px; border: 0; padding: 0; background: transparent; color: var(--muted); font-size: 0.75rem; }
        .swatch-info button:hover { color: var(--accent-dark); }
        .empty { padding: 50px 20px; color: var(--muted); text-align: center; }
        .saved { margin-top: 18px; padding: 18px; }
        .saved h2 { margin: 0 0 12px; font-family: Georgia, serif; font-size: 1.15rem; }
        .saved-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .saved-item { display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 5px 7px 5px 10px; background: rgba(255,255,255,0.6); font-size: 0.78rem; }
        .saved-dot { width: 15px; height: 15px; border-radius: 50%; }
        .saved-load { border: 0; padding: 0; background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
        .saved-load:hover { color: var(--accent-dark); }
        .saved-delete { width: 24px; height: 24px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); }
        .saved-delete:hover { background: rgba(167, 79, 54, 0.12); color: var(--accent-dark); }
        .status { min-height: 1.5em; margin: 12px 0 0; color: var(--accent-dark); font-size: 0.8rem; }

        @media (max-width: 820px) {
            .intro, .workbench { grid-template-columns: 1fr; }
            .intro-note { width: min(250px, 70%); margin-left: auto; }
            .swatches { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .swatch:first-child { grid-column: span 2; }
            .swatch-color { min-height: 180px; }
        }

        @media (max-width: 520px) {
            .shell { width: min(100% - 28px, 1180px); padding-top: 18px; }
            .topbar { margin-bottom: 48px; }
            h1 { font-size: 2.55rem; }
            .swatches { gap: 8px; }
            .swatch-color { min-height: 145px; }
        }
    </style>
</head>
<body>
    <nav id="mainNav"></nav>
    <div id="toast" class="toast"></div>
    <main class="shell">
        <header class="topbar">
            <a class="brand" href="../tools.html">solace / toolbox</a>
            <a class="back-link" href="../tools.html">ツール一覧へ戻る</a>
        </header>

        <section class="intro">
            <div>
                <span class="eyebrow">PALETTE WORKBENCH</span>
                <h1>色を試して、<br>作品の温度を決める。</h1>
                <p>気になる色を残しながら、明るさと鮮やかさを調整できます。気に入ったパレットは、このブラウザーに保存されます。</p>
            </div>
            <aside class="intro-note">
                <strong>ひらめきは、仮置きでいい。</strong>
                <span>正解を探すより、まず並べてみる。</span>
            </aside>
        </section>

        <section class="workbench" aria-label="パレット作成">
            <aside class="panel controls">
                <h2 class="panel-title">つくり方</h2>
                <div class="field">
                    <label for="colorMood">雰囲気</label>
                    <select id="colorMood">
                        <option value="random">おまかせ</option>
                        <option value="warm">あたたかい</option>
                        <option value="cool">涼しい</option>
                        <option value="soft">やわらかい</option>
                        <option value="deep">深みのある</option>
                    </select>
                </div>
                <div class="field">
                    <label for="colorCount">色の数 <output id="countOutput">5</output></label>
                    <input id="colorCount" type="range" min="3" max="8" value="5">
                </div>
                <div class="field">
                    <label for="colorSaturation">鮮やかさ <output id="saturationOutput">62</output></label>
                    <input id="colorSaturation" type="range" min="25" max="90" value="62">
                </div>
                <div class="field">
                    <label for="colorLightness">明るさ <output id="lightnessOutput">58</output></label>
                    <input id="colorLightness" type="range" min="25" max="78" value="58">
                </div>
                <div class="control-actions">
                    <button class="button" id="generateButton" type="button">新しいパレットをつくる</button>
                    <button class="button secondary" id="saveButton" type="button">このパレットを保存</button>
                    <button class="button secondary" id="copyButton" type="button">カラーコードをコピー</button>
                </div>
            </aside>

            <div>
                <section class="panel palette-panel">
                    <div class="palette-header">
                        <h2>いまのパレット</h2>
                        <span>色をクリックするとコードをコピー</span>
                    </div>
                    <div class="swatches" id="swatches"></div>
                </section>
                <section class="panel saved" aria-live="polite">
                    <h2>保存したパレット</h2>
                    <div class="saved-list" id="savedList"><span class="empty">まだ保存されたパレットはありません。</span></div>
                    <p class="status" id="statusMessage" role="status" aria-live="polite"></p>
                </section>
            </div>
        </section>
    </main>

    <script src="common.js?v=20260303-layout"></script>
    <script>
        (() => {
            document.addEventListener('DOMContentLoaded', () => {
                buildNav('random');
                buildHistoryNav('palette-workbench.html');
            });
            const readSaved = () => {
                try {
                    const saved = JSON.parse(localStorage.getItem('solace.palette.saved') || '[]');
                    return Array.isArray(saved) ? saved.filter((palette) => Array.isArray(palette) && palette.length) : [];
                } catch (error) {
                    return [];
                }
            };
            const readDraft = () => {
                try {
                    const draft = JSON.parse(localStorage.getItem('solace.palette.draft') || 'null');
                    if (!draft || !Array.isArray(draft.colors) || !draft.colors.length) return null;
                    return draft;
                } catch (error) {
                    return null;
                }
            };
            const draft = readDraft();
            const state = {
                colors: draft?.colors || [],
                locked: draft?.locked || [],
                saved: readSaved()
            };
            const $ = (id) => document.getElementById(id);
            const random = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
            const saveDraft = () => {
                try {
                    localStorage.setItem('solace.palette.draft', JSON.stringify({
                        colors: state.colors,
                        locked: state.locked,
                        mood: $('colorMood').value,
                        saturation: $('colorSaturation').value,
                        lightness: $('colorLightness').value
                    }));
                } catch (error) {
                    // 制作中の操作は、保存領域が満杯でも止めない。
                }
            };
            const hslToHex = (h, s, l) => {
                const k = (n) => (n + h / 30) % 12;
                const a = s / 100 * Math.min(l / 100, 1 - l / 100);
                const f = (n) => Math.round(255 * (l / 100 - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)))))
                    .toString(16).padStart(2, '0');
                return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
            };
            const getHue = (mood) => {
                if (mood === 'warm') return random(0, 68);
                if (mood === 'cool') return random(165, 255);
                if (mood === 'soft') return random(280, 350);
                if (mood === 'deep') return random(205, 285);
                return random(0, 359);
            };
            const getColor = () => {
                const mood = $('colorMood').value;
                const saturation = Number($('colorSaturation').value);
                const lightness = Number($('colorLightness').value);
                const hue = getHue(mood);
                const spread = random(-18, 18);
                return hslToHex((hue + spread + 360) % 360, clamp(saturation + random(-8, 8), 10, 100), clamp(lightness + random(-10, 10), 8, 92));
            };
            const renderSaved = () => {
                const list = $('savedList');
                list.replaceChildren();
                if (!state.saved.length) {
                    list.innerHTML = '<span class="empty">まだ保存されたパレットはありません。</span>';
                    return;
                }
                state.saved.slice().reverse().forEach((palette) => {
                    const item = document.createElement('div');
                    item.className = 'saved-item';
                    const dot = document.createElement('span');
                    dot.className = 'saved-dot';
                    dot.style.background = palette[0];
                    const loadButton = document.createElement('button');
                    loadButton.className = 'saved-load';
                    loadButton.type = 'button';
                    loadButton.textContent = `${palette[0]} ほか${palette.length - 1}色`;
                    loadButton.addEventListener('click', () => {
                        state.colors = [...palette];
                        state.locked = state.colors.map(() => false);
                        $('colorCount').value = state.colors.length;
                        saveDraft();
                        render();
                        showStatus('保存したパレットを読み込みました。');
                    });
                    const deleteButton = document.createElement('button');
                    deleteButton.className = 'saved-delete';
                    deleteButton.type = 'button';
                    deleteButton.textContent = '×';
                    deleteButton.setAttribute('aria-label', `${palette[0]} の保存を削除`);
                    deleteButton.addEventListener('click', () => {
                        state.saved = state.saved.filter((savedPalette) => savedPalette !== palette);
                        localStorage.setItem('solace.palette.saved', JSON.stringify(state.saved));
                        renderSaved();
                        showStatus('保存したパレットを削除しました。');
                    });
                    item.append(dot, loadButton, deleteButton);
                    list.appendChild(item);
                });
            };
            const showStatus = (message) => {
                $('statusMessage').textContent = message;
                clearTimeout(showStatus.timer);
                showStatus.timer = setTimeout(() => { $('statusMessage').textContent = ''; }, 2600);
            };
            const copy = async (text) => {
                try { await navigator.clipboard.writeText(text); } catch (error) { window.prompt('カラーコードをコピーしてください', text); }
            };
            const render = () => {
                $('countOutput').value = $('colorCount').value;
                $('saturationOutput').value = $('colorSaturation').value;
                $('lightnessOutput').value = $('colorLightness').value;
                const swatches = $('swatches');
                swatches.replaceChildren();
                state.colors.forEach((color, index) => {
                    const card = document.createElement('article');
                    card.className = 'swatch';
                    const colorBox = document.createElement('div');
                    colorBox.className = 'swatch-color';
                    colorBox.style.background = color;
                    const lock = document.createElement('button');
                    lock.className = 'lock';
                    lock.type = 'button';
                    lock.textContent = state.locked[index] ? '●' : '◇';
                    lock.setAttribute('aria-label', `${index + 1}番目の色を固定`);
                    lock.setAttribute('aria-pressed', String(Boolean(state.locked[index])));
                    lock.addEventListener('click', (event) => {
                        event.stopPropagation();
                        state.locked[index] = !state.locked[index];
                        saveDraft();
                        render();
                    });
                    colorBox.appendChild(lock);
                    const info = document.createElement('div');
                    info.className = 'swatch-info';
                    const label = document.createElement('strong');
                    label.textContent = color;
                    const copyButton = document.createElement('button');
                    copyButton.type = 'button';
                    copyButton.textContent = 'コードをコピー';
                    copyButton.addEventListener('click', async () => {
                        await copy(color);
                        showStatus('カラーコードをコピーしました。');
                    });
                    info.append(label, copyButton);
                    card.append(colorBox, info);
                    card.addEventListener('click', () => copy(color));
                    swatches.appendChild(card);
                });
            };
            const generate = () => {
                const count = Number($('colorCount').value);
                state.colors = Array.from({ length: count }, (_, index) => state.locked[index] ? state.colors[index] : getColor());
                state.locked = state.locked.slice(0, count);
                saveDraft();
                render();
            };
            $('generateButton').addEventListener('click', generate);
            $('saveButton').addEventListener('click', () => {
                if (!state.colors.length) return;
                if (state.saved.some((palette) => palette.join(',') === state.colors.join(','))) {
                    showStatus('このパレットは保存済みです。');
                    return;
                }
                state.saved.push([...state.colors]);
                state.saved = state.saved.slice(-12);
                localStorage.setItem('solace.palette.saved', JSON.stringify(state.saved));
                renderSaved();
                showStatus('パレットを保存しました。');
            });
            $('copyButton').addEventListener('click', async () => {
                await copy(state.colors.join('\n'));
                showStatus('カラーコードをコピーしました。');
            });
            ['colorCount', 'colorSaturation', 'colorLightness'].forEach((id) => $(id).addEventListener('input', () => {
                saveDraft();
                render();
            }));
            if (draft) {
                $('colorMood').value = draft.mood || 'random';
                $('colorCount').value = draft.colors.length;
                $('colorSaturation').value = draft.saturation || '62';
                $('colorLightness').value = draft.lightness || '58';
                render();
            } else {
                generate();
            }
            renderSaved();
        })();
    </script>
</body>
</html>
