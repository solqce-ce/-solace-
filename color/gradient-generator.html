  <style>

    @media (max-width: 520px) {

    }

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      buildNav('gradient');
      buildHistoryNav('gradient-generator.html');
      applyTheme();
      injectCommonStyles();

      const preview = document.getElementById('gradientPreview');
      const typeTabs = document.getElementById('typeTabs');
      const angleRow = document.getElementById('angleRow');
      const angleSlider = document.getElementById('angleSlider');
      const angleValue = document.getElementById('angleValue');
      const noiseSlider = document.getElementById('noiseSlider');
      const noiseValue = document.getElementById('noiseValue');
      const noiseModeEl = document.getElementById('noiseMode');
      const stopsList = document.getElementById('stopsList');
      const addStopBtn = document.getElementById('addStopBtn');
      const cssCode = document.getElementById('cssCode');
      const outputFormat = document.getElementById('outputFormat');
      const copyCssBtn = document.getElementById('copyCssBtn');
      const svgBtn = document.getElementById('svgBtn');
      const shareBtn = document.getElementById('shareBtn');
      const randomizeBtn = document.getElementById('randomizeBtn');
      const saveBtn = document.getElementById('saveBtn');
      const workspaceSelect = document.getElementById('workspaceSelect');
      const workspaceLoadBtn = document.getElementById('workspaceLoadBtn');
      const workspaceNewBtn = document.getElementById('workspaceNewBtn');
      const presetsGrid = document.getElementById('presetsGrid');

      let gradientType = 'linear';
      let angle = 135;
      let noiseStrength = 0;
      let noiseMode = 'noise';
      let stops = [
        { color: '#667eea', position: 0 },
        { color: '#764ba2', position: 100 }
      ];

      const presets = [
        { stops: [{ color: '#667eea', position: 0 }, { color: '#764ba2', position: 100 }], angle: 135 },
        { stops: [{ color: '#f093fb', position: 0 }, { color: '#f5576c', position: 100 }], angle: 135 },
        { stops: [{ color: '#4facfe', position: 0 }, { color: '#00f2fe', position: 100 }], angle: 135 },
        { stops: [{ color: '#43e97b', position: 0 }, { color: '#38f9d7', position: 100 }], angle: 135 },
        { stops: [{ color: '#fa709a', position: 0 }, { color: '#fee140', position: 100 }], angle: 135 },
        { stops: [{ color: '#a18cd1', position: 0 }, { color: '#fbc2eb', position: 100 }], angle: 135 },
        { stops: [{ color: '#0c3483', position: 0 }, { color: '#a2b6df', position: 50 }, { color: '#6b8cce', position: 100 }], angle: 135 },
        { stops: [{ color: '#ff9a9e', position: 0 }, { color: '#fecfef', position: 50 }, { color: '#fdfcfb', position: 100 }], angle: 0 }
      ];

      function clamp(num, min, max) {
        return Math.min(Math.max(num, min), max);
      }

      function randomHex() {
        return `#${Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0')}`.toUpperCase();
      }

      function buildGradientCSS() {
        const stopsStr = stops.map((stop) => `${stop.color} ${stop.position}%`).join(', ');
        if (gradientType === 'linear') return `linear-gradient(${angle}deg, ${stopsStr})`;
        if (gradientType === 'radial') return `radial-gradient(circle, ${stopsStr})`;
        return `conic-gradient(from ${angle}deg, ${stopsStr})`;
      }

      function generateNoiseDataURL(opacityPercent, mode) {
        if (opacityPercent <= 0) return '';
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        const image = ctx.createImageData(canvas.width, canvas.height);
        const alpha = Math.round((opacityPercent / 100) * (mode === 'grain' ? 64 : 90));
        for (let i = 0; i < image.data.length; i += 4) {
          const random = Math.random();
          const value = mode === 'grain' ? Math.round(110 + random * 130) : (random > 0.5 ? 255 : 0);
          image.data[i] = value;
          image.data[i + 1] = value;
          image.data[i + 2] = value;
          image.data[i + 3] = alpha;
        }
        ctx.putImageData(image, 0, 0);
        return canvas.toDataURL('image/png');
      }

      function buildOutputText() {
        const css = buildGradientCSS();
        const fmt = outputFormat.value;

        if (fmt === 'css') {
          const noisePart = noiseStrength > 0 ? `\nbackground-image: url(<noise-texture>), ${css};\nbackground-blend-mode: overlay;` : '';
          return `background: ${css};${noisePart}`;
        }

        if (fmt === 'vars') {
          const vars = stops.map((stop, index) => `  --gradient-stop-${index + 1}: ${stop.color};`).join('\n');
          return `:root {\n${vars}\n  --gradient-value: ${css};\n  --gradient-noise: ${noiseStrength}%;\n}`;
        }

        if (fmt === 'tailwind') {
          return `module.exports = {\n  theme: {\n    extend: {\n      backgroundImage: {\n        'custom-gradient': '${css.replace(/'/g, "\\'")}'\n      }\n    }\n  }\n};`;
        }

        return JSON.stringify({ type: gradientType, angle, noiseStrength, noiseMode, stops, css }, null, 2);
      }

      function syncUrlState() {
        const payload = btoa(encodeURIComponent(JSON.stringify({ type: gradientType, angle, noiseStrength, noiseMode, stops })));
        const params = new URLSearchParams(window.location.search);
        params.set('state', payload);
        history.replaceState(null, '', `${window.location.pathname}?${params.toString()}`);
      }

      function applyStateFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const encoded = params.get('state');
        if (!encoded) return;
        try {
          const raw = JSON.parse(decodeURIComponent(atob(encoded)));
          if (['linear', 'radial', 'conic'].includes(raw.type)) gradientType = raw.type;
          if (Number.isFinite(raw.angle)) angle = clamp(Number(raw.angle), 0, 360);
          if (Number.isFinite(raw.noiseStrength)) noiseStrength = clamp(Number(raw.noiseStrength), 0, 40);
          if (raw.noiseMode === 'noise' || raw.noiseMode === 'grain') noiseMode = raw.noiseMode;
          if (Array.isArray(raw.stops) && raw.stops.length >= 2) {
            stops = raw.stops.map((stop) => ({
              color: /^#[0-9A-Fa-f]{6}$/.test(stop.color) ? stop.color : '#888888',
              position: clamp(Number(stop.position) || 0, 0, 100)
            }));
          }
        } catch (error) {
          console.warn('Invalid shared gradient state', error);
        }
      }

      function serializeWorkspaceState() {
        return { type: gradientType, angle, noiseStrength, noiseMode, stops, outputFormat: outputFormat.value };
      }

      function applyWorkspaceState(state) {
        if (!state) return;
        if (['linear', 'radial', 'conic'].includes(state.type)) gradientType = state.type;
        if (Number.isFinite(state.angle)) angle = clamp(Number(state.angle), 0, 360);
        if (Number.isFinite(state.noiseStrength)) noiseStrength = clamp(Number(state.noiseStrength), 0, 40);
        if (state.noiseMode === 'noise' || state.noiseMode === 'grain') noiseMode = state.noiseMode;
        if (Array.isArray(state.stops) && state.stops.length >= 2) {
          stops = state.stops.map((stop) => ({
            color: /^#[0-9A-Fa-f]{6}$/.test(stop.color) ? stop.color : '#888888',
            position: clamp(Number(stop.position) || 0, 0, 100)
          }));
        }
        if (['css', 'vars', 'tailwind', 'json'].includes(state.outputFormat)) {
          outputFormat.value = state.outputFormat;
        }
      }

      function populateWorkspaceProfiles() {
        const profiles = getWorkspaceProfiles();
        const active = getActiveWorkspaceProfile();
        workspaceSelect.innerHTML = '';
        profiles.forEach((profile) => {
          const option = document.createElement('option');
          option.value = profile.id;
          option.textContent = profile.name;
          workspaceSelect.appendChild(option);
        });
        workspaceSelect.value = active;
      }

      function saveCurrentWorkspaceState() {
        const id = workspaceSelect.value || getActiveWorkspaceProfile();
        saveWorkspaceState('gradient', serializeWorkspaceState(), id);
        showToast('ワークスペースに保存しました');
      }

      function loadCurrentWorkspaceState() {
        const id = workspaceSelect.value || getActiveWorkspaceProfile();
        const state = loadWorkspaceState('gradient', id);
        if (!state) {
          showToast('保存された状態がありません', 2200, 'warning');
          return;
        }
        applyWorkspaceState(state);
        renderStops();
        update();
        showToast('ワークスペース状態を読み込みました');
      }

      function createNewWorkspaceProfileForPage() {
        const name = prompt('新しいワークスペース名を入力してください');
        if (!name) return;
        const id = createWorkspaceProfile(name);
        if (!id) return;
        setActiveWorkspaceProfile(id);
        populateWorkspaceProfiles();
        workspaceSelect.value = id;
        showToast('ワークスペースを作成しました');
      }

      function renderStops() {
        stopsList.innerHTML = '';
        stops.forEach((stop, index) => {
          const row = document.createElement('div');
          row.className = 'stop-row';

          const colorInput = document.createElement('input');
          colorInput.type = 'color';
          colorInput.value = stop.color;
          colorInput.addEventListener('input', () => {
            stop.color = colorInput.value;
            hexInput.value = stop.color.toUpperCase();
            update();
          });

          const hexInput = document.createElement('input');
          hexInput.type = 'text';
          hexInput.value = stop.color.toUpperCase();
          hexInput.maxLength = 7;
          hexInput.spellcheck = false;
          hexInput.addEventListener('input', () => {
            let val = hexInput.value.trim();
            if (!val.startsWith('#')) val = '#' + val;
            if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
              stop.color = val;
              colorInput.value = val;
              update();
            }
          });

          const slider = document.createElement('input');
          slider.type = 'range';
          slider.min = '0';
          slider.max = '100';
          slider.value = String(stop.position);
          slider.addEventListener('input', () => {
            stop.position = Number(slider.value);
            label.textContent = `${stop.position}%`;
            update();
          });

          const label = document.createElement('span');
          label.className = 'pos-label';
          label.textContent = `${stop.position}%`;

          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.className = 'stop-remove';
          removeBtn.textContent = '✕';
          removeBtn.addEventListener('click', () => {
            if (stops.length <= 2) {
              showToast('最低2色必要です', 2200, 'warning');
              return;
            }
            stops.splice(index, 1);
            renderStops();
            update();
          });

          row.appendChild(colorInput);
          row.appendChild(hexInput);
          row.appendChild(slider);
          row.appendChild(label);
          row.appendChild(removeBtn);
          stopsList.appendChild(row);
        });
      }

      function renderPresets() {
        presetsGrid.innerHTML = '';
        presets.forEach((preset) => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'preset-item';
          const stopsStr = preset.stops.map((s) => `${s.color} ${s.position}%`).join(', ');
          item.style.background = `linear-gradient(${preset.angle}deg, ${stopsStr})`;
          item.title = 'プリセットを適用';
          item.addEventListener('click', () => {
            stops = preset.stops.map((s) => ({ ...s }));
            angle = preset.angle;
            noiseStrength = 0;
            renderStops();
            update();
          });
          presetsGrid.appendChild(item);
        });
      }

      function randomize() {
        const count = Math.floor(Math.random() * 3) + 2;
        const next = [];
        for (let i = 0; i < count; i += 1) {
          next.push({
            color: randomHex(),
            position: Math.round((i / Math.max(count - 1, 1)) * 100)
          });
        }
        stops = next;
        angle = Math.floor(Math.random() * 360);
        noiseStrength = Math.floor(Math.random() * 21);
        renderStops();
        update();
      }

      function update() {
        const css = buildGradientCSS();
        preview.style.backgroundImage = noiseStrength > 0
          ? `url(${generateNoiseDataURL(noiseStrength, noiseMode)}), ${css}`
          : css;
        preview.style.backgroundBlendMode = noiseStrength > 0 ? (noiseMode === 'grain' ? 'soft-light, normal' : 'overlay, normal') : 'normal';
        preview.style.backgroundSize = noiseStrength > 0 ? '128px 128px, cover' : 'cover';
        cssCode.textContent = buildOutputText();
        angleSlider.value = String(angle);
        angleValue.textContent = `${angle}°`;
        noiseSlider.value = String(noiseStrength);
        noiseValue.textContent = `${noiseStrength}%`;
        noiseModeEl.value = noiseMode;

        if (gradientType === 'radial') {
          angleRow.style.display = 'none';
        } else {
          angleRow.style.display = 'block';
        }

        typeTabs.querySelectorAll('.type-tab').forEach((tab) => {
          tab.classList.toggle('active', tab.dataset.type === gradientType);
        });

        syncUrlState();
      }

      function downloadSvg() {
        if (gradientType === 'conic') {
          showToast('Conic の SVG 保存は未対応です。Linear / Radial を選択してください。', 2600, 'warning');
          return;
        }

        const ordered = [...stops].sort((a, b) => a.position - b.position);
        const gradientId = 'grad';
        if (gradientType === 'linear') {
          const defs = `<linearGradient id="${gradientId}" gradientTransform="rotate(${angle} .5 .5)">${ordered.map((s) => `<stop offset="${s.position}%" stop-color="${s.color}"/>`).join('')}</linearGradient>`;
          const svg = `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">\n  <defs>${defs}</defs>\n  <rect width="1600" height="900" fill="url(#${gradientId})"/>\n</svg>`;
          downloadBlob(svg, 'gradient.svg');
          return;
        }

        const defs = `<radialGradient id="${gradientId}" cx="50%" cy="50%" r="60%">${ordered.map((s) => `<stop offset="${s.position}%" stop-color="${s.color}"/>`).join('')}</radialGradient>`;
        const svg = `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">\n  <defs>${defs}</defs>\n  <rect width="1600" height="900" fill="url(#${gradientId})"/>\n</svg>`;
        downloadBlob(svg, 'gradient.svg');
      }

      function downloadBlob(content, filename) {
        const blob = new Blob([content], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }

      typeTabs.addEventListener('click', (event) => {
        const tab = event.target.closest('.type-tab');
        if (!tab) return;
        gradientType = tab.dataset.type;
        update();
      });

      angleSlider.addEventListener('input', () => {
        angle = Number(angleSlider.value);
        update();
      });

      noiseSlider.addEventListener('input', () => {
        noiseStrength = Number(noiseSlider.value);
        update();
      });

      noiseModeEl.addEventListener('change', () => {
        noiseMode = noiseModeEl.value;
        update();
      });

      addStopBtn.addEventListener('click', () => {
        if (stops.length >= 8) {
          showToast('最大8色までです', 2200, 'warning');
          return;
        }
        const last = stops[stops.length - 1]?.color || '#888888';
        stops.push({ color: last, position: 100 });
        stops.forEach((stop, idx) => {
          stop.position = Math.round((idx / (stops.length - 1)) * 100);
        });
        renderStops();
        update();
      });

      copyCssBtn.addEventListener('click', () => {
        copyTextToClipboard(cssCode.textContent, {
          successMessage: 'CSSをコピーしました',
          emptyMessage: '',
          fallbackMessage: 'コピーできませんでした'
        });
      });

      shareBtn.addEventListener('click', () => {
        syncUrlState();
        const url = `${window.location.origin}${window.location.pathname}${window.location.search}`;
        copyTextToClipboard(url, {
          successMessage: '共有URLをコピーしました',
          emptyMessage: '',
          fallbackMessage: 'コピーできませんでした'
        });
      });

      outputFormat.addEventListener('change', update);
      svgBtn.addEventListener('click', downloadSvg);
      randomizeBtn.addEventListener('click', randomize);
      saveBtn.addEventListener('click', saveCurrentWorkspaceState);
      workspaceLoadBtn.addEventListener('click', loadCurrentWorkspaceState);
      workspaceNewBtn.addEventListener('click', createNewWorkspaceProfileForPage);
      workspaceSelect.addEventListener('change', () => setActiveWorkspaceProfile(workspaceSelect.value));

      document.addEventListener('keydown', (event) => {
        const tag = String(event.target?.tagName || '').toLowerCase();
        const editable = tag === 'input' || tag === 'textarea' || event.target?.isContentEditable;
        if (editable) return;
        const key = event.key.toLowerCase();
        if (key === 'r') {
          event.preventDefault();
          randomize();
        }
        if (key === 'c') {
          event.preventDefault();
          copyCssBtn.click();
        }
        if (key === 's') {
          event.preventDefault();
          shareBtn.click();
        }
        if (key === 'e') {
          event.preventDefault();
          svgBtn.click();
        }
      });

      applyStateFromUrl();
      populateWorkspaceProfiles();
      renderStops();
      renderPresets();
      update();
    });
  </script>
</body>
</html>
